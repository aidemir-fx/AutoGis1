version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: autogis_postgres
    environment:
      POSTGRES_DB: auto_masters
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO — S3-compatible local storage for development
  minio:
    image: minio/minio:latest
    container_name: autogis_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console: http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the dev bucket automatically on first start
  minio-init:
    image: minio/mc:latest
    container_name: autogis_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/autogis-media-dev;
        mc anonymous set download local/autogis-media-dev;
        echo 'MinIO bucket ready';
      "
    restart: "no"

volumes:
  postgres_data:
  minio_data:
